<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/pwa-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0b0d" />
  <!-- Aggiunta alla schermata Home di iPhone e iPad: si apre a tutto schermo, come un'app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SmartEats</title>
  <!-- Tema del personale scelto prima del primo disegno (niente lampo chiaro→scuro). Le pagine dei clienti seguono il sistema. -->
  <script>
    try {
      if (!/^\/(book|order|menu|privacy|terms|s)(\/|$)/.test(location.pathname) && localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');
    } catch (e) { /* senza archivio locale: resta il chiaro */ }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
