name: Rilascio

# Costruisce l'immagine e la pubblica su GHCR a ogni nuovo tag (v1.2.3) o a mano.
# Il server la scarica con: cd deploy && docker compose pull && docker compose up -d
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Il ciclo completo dei test: un rilascio parte solo se tutto è verde (la PR ha provato solo ciò che aveva toccato).
  controlli:
    uses: ./.github/workflows/ci.yml

  image:
    needs: controlli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # L'etichetta (v0.3.0) e la versione dentro l'app (frontend/package.json) devono essere lo stesso numero:
      # è quella che l'app mostra nelle novità.
      - name: Controlla che l'etichetta coincida con la versione dell'app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(node -p "require('./frontend/package.json').version")
          [ "v$app" = "${GITHUB_REF_NAME}" ] || { echo "L'etichetta ${GITHUB_REF_NAME} non coincide con frontend/package.json (v$app)"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
