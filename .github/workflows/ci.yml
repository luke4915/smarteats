name: CI

# Su una PR si lanciano i test MIRATI: sempre logica, lint e build; i test col database e nel browser solo se ciò che è cambiato
# li riguarda (li sceglie scripts/select-tests.mjs, lo stesso di scripts/check.sh). Il CICLO COMPLETO gira a ogni modifica di
# `main`, a mano (Actions → CI → Run workflow) e prima di ogni rilascio (release.yml lo richiama).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  scelta:
    name: scelta dei test
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.s.outputs.code }}
      integration: ${{ steps.s.outputs.integration }}
      e2e: ${{ steps.s.outputs.e2e }}
      full: ${{ steps.s.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: s
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            json=$(node scripts/select-tests.mjs --base "origin/${{ github.base_ref }}")
          else
            json=$(node scripts/select-tests.mjs --full)
          fi
          echo "$json"
          pick() { node -e "const v=JSON.parse(process.argv[1])[process.argv[2]]; console.log(Array.isArray(v)?v.join(' '):v)" "$json" "$1"; }
          echo "code=$(pick code)" >> "$GITHUB_OUTPUT"
          echo "full=$(pick full)" >> "$GITHUB_OUTPUT"
          echo "integration=$(pick integration)" >> "$GITHUB_OUTPUT"
          echo "e2e=$(pick e2e)" >> "$GITHUB_OUTPUT"

  frontend:
    needs: scelta
    if: needs.scelta.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    needs: scelta
    if: needs.scelta.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smarteats_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

      # I test col database servono solo se ne è stato scelto qualcuno: database di prova come in locale (schema.sql con
      # l'utente applicativo soggetto a RLS). Il ruolo "colettas" è il proprietario nominato nel dump di schema.sql.
      - name: Prepara il database di prova
        if: needs.scelta.outputs.integration != ''
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE colettas SUPERUSER LOGIN"
          psql -h localhost -U postgres -c "CREATE ROLE smarteats_app LOGIN PASSWORD 'ci-password'"
          psql -h localhost -U postgres -c "CREATE ROLE smarteats_master LOGIN PASSWORD 'ci-master-password'"
          psql -h localhost -U postgres -d smarteats_test -q -f schema.sql
          cat > .env.test <<'EOF'
          PG_USER=smarteats_app
          PG_PASSWORD=ci-password
          PG_HOST=localhost
          PG_PORT=5432
          PG_DATABASE=smarteats_test
          PG_MASTER_USER=smarteats_master
          PG_MASTER_PASSWORD=ci-master-password
          TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/smarteats_test
          MIGRATION_DATABASE_URL=postgres://postgres:postgres@localhost:5432/smarteats_test
          JWT_SECRET=una-stringa-di-prova-lunga-almeno-32-caratteri
          LOG_LEVEL=silent
          EOF
          MIGRATION_DATABASE_URL=postgres://postgres:postgres@localhost:5432/smarteats_test \
          PG_USER=smarteats_app PG_PASSWORD=ci-password PG_HOST=localhost PG_DATABASE=smarteats_test \
            npm run db:baseline

      - name: Test col database
        if: needs.scelta.outputs.integration != ''
        run: |
          if [ "${{ needs.scelta.outputs.integration }}" = "all" ]; then
            npm run test:integration
          else
            files=""; for f in ${{ needs.scelta.outputs.integration }}; do files="$files tests/integration/$f"; done
            node --test --test-concurrency=1 $files
          fi

  # Test nel browser: l'app vera (backend + frontend compilato) con locali di prova, un browser automatico che fa il giro del
  # ristorante e della sagra (anche da telefono). Solo i test che attraversano ciò che è cambiato, salvo il ciclo completo.
  # Gli screenshot restano come allegato per guardarli a occhio.
  e2e:
    needs: scelta
    if: needs.scelta.outputs.e2e != ''
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smarteats_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa backend e frontend
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Prepara il database di prova
        working-directory: backend
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE colettas SUPERUSER LOGIN"
          psql -h localhost -U postgres -c "CREATE ROLE smarteats_app LOGIN PASSWORD 'ci-password'"
          psql -h localhost -U postgres -c "CREATE ROLE smarteats_master LOGIN PASSWORD 'ci-master-password'"
          psql -h localhost -U postgres -d smarteats_test -q -f schema.sql
          cat > .env.test <<'EOT'
          PG_USER=smarteats_app
          PG_PASSWORD=ci-password
          PG_HOST=localhost
          PG_PORT=5432
          PG_DATABASE=smarteats_test
          PG_MASTER_USER=smarteats_master
          PG_MASTER_PASSWORD=ci-master-password
          TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/smarteats_test
          MIGRATION_DATABASE_URL=postgres://postgres:postgres@localhost:5432/smarteats_test
          JWT_SECRET=una-stringa-di-prova-lunga-almeno-32-caratteri
          LOG_LEVEL=silent
          EOT
          MIGRATION_DATABASE_URL=postgres://postgres:postgres@localhost:5432/smarteats_test \
          PG_USER=smarteats_app PG_PASSWORD=ci-password PG_HOST=localhost PG_DATABASE=smarteats_test \
            npm run db:baseline
      - name: Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Costruisce il frontend e lancia i test nel browser
        working-directory: frontend
        run: |
          if [ "${{ needs.scelta.outputs.e2e }}" = "all" ]; then
            npm run e2e
          else
            specs=""; for f in ${{ needs.scelta.outputs.e2e }}; do specs="$specs e2e/$f"; done
            npm run e2e -- $specs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermate-e-risultati
          path: frontend/e2e/.run
          retention-days: 7
